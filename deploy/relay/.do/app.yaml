# The live relay.nanolathe.gg app, as applied with
# `doctl apps update <app-id> --spec .do/app.yaml` (DESIGN_MULTIPLAYER §16.5.6).
name: nanolathe-relay
region: sfo
domains:
  - domain: relay.nanolathe.gg
    type: PRIMARY
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: nanolathe-relay
    github:
      repo: nanolathe-gg/nanolathe-relay
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: /Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      # The image's separate health listener, outside the relay's
      # 128-connection limit; the platform never routes it publicly.
      http_path: /healthz
      port: 8081
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    termination:
      drain_seconds: 1
      grace_period_seconds: 15
    envs:
      # A soft heap limit with headroom inside the 512 MiB instance.
      - key: GOMEMLIMIT
        scope: RUN_TIME
        value: 384MiB
      - key: GOMAXPROCS
        scope: RUN_TIME
        value: "1"
ingress:
  rules:
    - component:
        name: nanolathe-relay
      match:
        path:
          prefix: /
