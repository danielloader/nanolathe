name: Relay checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t nanolathe-relay:test .
      - name: Container health and shutdown
        run: |
          docker run -d --name relay --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 nanolathe-relay:test
          trap 'docker rm -f relay' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/healthz
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18081/healthz
          docker stop -t 10 relay
          test "$(docker inspect --format '{{.State.ExitCode}}' relay)" = 0
